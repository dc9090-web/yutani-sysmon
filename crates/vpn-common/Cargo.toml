[package]
name = "yutani-vpn-common"
description = "Shared parts of the COSMIC VPN applet and its helper: conf parser, NAT-PMP codec, status types"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "vpn_common"

[dependencies]
base64 = "0.22"
serde.workspace = true
zeroize = { version = "1", features = ["zeroize_derive"] }
zvariant = { version = "5", default-features = false }

[dev-dependencies]
serde_json = "1"
