[package]
name = "cosmic-vpn-helper"
description = "Root helper for the COSMIC VPN applet: the qBittorrent network namespace, WireGuard, NAT-PMP and the qBittorrent launcher"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vpn-common = { path = "../vpn-common", package = "yutani-vpn-common" }
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
nix = { version = "0.30", default-features = false, features = ["sched", "mount", "user", "fs", "signal"] }
rtnetlink = "0.17"
netlink-packet-route = "0.24"
wireguard-uapi = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
zeroize = "1"
