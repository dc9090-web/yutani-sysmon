<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- /usr/share/dbus-1/system.d/ : only root may own the name; anyone may call it (polkit decides per method). -->
<busconfig>
  <policy user="root">
    <allow own="io.github.dc.CosmicVpnHelper"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.dc.CosmicVpnHelper"/>
    <allow receive_sender="io.github.dc.CosmicVpnHelper"/>
  </policy>
</busconfig>
