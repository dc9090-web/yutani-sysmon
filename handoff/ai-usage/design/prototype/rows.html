<!doctype html>
<html data-theme="dark"><head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="bundle.css"><script src="bundle.js"></script><meta charset="utf-8"><title>QuotaRow — preview</title></head>
<body>
<div class="proto-bar"><a href="index.html">Prototype</a><a href="panel.html">Panel button</a><a href="rows.html" aria-current="page">Quota rows</a><a href="header.html">Header</a><a href="states.html">States</a><a href="icons.html">Icon study</a><span class="sp"></span><button id="themeBtn" type="button">Theme: dark</button></div>
<div class="ca-stage">
  <div class="col"><span class="ca-tag">Used · relative resets</span><div class="ca-popup" id="a"></div></div>
  <div class="col"><span class="ca-tag">Left · absolute resets · limit reached</span><div class="ca-popup" id="b"></div></div>
</div>
<script>
  var A = window.CosmicApplets;
  function paint() {
    var now = Date.now(), q = A.quotaSim(now);
    document.getElementById('a').innerHTML = q.windows.map(function (w) { return A.quotaRowHTML(w, now, { reset: 'relative' }); }).join('');
    var full = Object.assign({}, q.windows[0], { used: 100, resetAt: now + 65 * 60e3 });
    document.getElementById('b').innerHTML = [full, q.windows[1], q.windows[2]].map(function (w) { return A.quotaRowHTML(w, now, { amount: 'left', reset: 'absolute' }); }).join('');
  }
  paint(); setInterval(paint, 30000);
</script>
<script>(function(){var r=document.documentElement,b=document.getElementById('themeBtn');try{var s=localStorage.getItem('ca-theme');if(s)r.dataset.theme=s;}catch(e){}
function l(){b.textContent='Theme: '+r.dataset.theme;}l();b.onclick=function(){r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('ca-theme',r.dataset.theme);}catch(e){}l();};})();</script>
</body></html>
