<!doctype html>
<html data-theme="dark"><head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="bundle.css"><script src="bundle.js"></script><meta charset="utf-8"><title>IndicatorPicker — preview</title></head>
<body>
<div class="proto-bar"><a href="index.html">Prototype</a><a href="panel.html">Panel button</a><a href="states.html">Popup states</a><a href="indicators.html">Indicators</a><a href="picker.html" aria-current="page">Indicator picker</a><a href="graph.html">Graph</a><a href="adapters.html">Adapter list</a><span class="sp"></span><button id="themeBtn" type="button">Theme: dark</button></div>
<div class="ca-stage"><div class="ca-popup">
  <div class="ca-pad ca-caption-heading" id="lbl">Direction indicator</div>
  <div class="ca-pad"><div class="ca-seg icons" role="group" aria-labelledby="lbl" id="seg"></div></div>
  <div class="ca-pad ca-caption" id="cap" style="padding-top:0"></div>
</div></div>
<script>
  var A = window.CosmicApplets, sel = A.DEFAULT_INDICATOR, seg = document.getElementById('seg');
  function paint() { seg.innerHTML = A.pickerHTML(sel); var i = A.IND[sel]; document.getElementById('cap').textContent = i.name + ' · ' + i.note; }
  seg.onclick = function (e) { var b = e.target.closest('button'); if (b) { sel = b.dataset.v; paint(); } };
  paint();
</script>
<script>(function(){var r=document.documentElement,b=document.getElementById('themeBtn');try{var s=localStorage.getItem('ca-theme');if(s)r.dataset.theme=s;}catch(e){}
function l(){b.textContent='Theme: '+r.dataset.theme;}l();b.onclick=function(){r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('ca-theme',r.dataset.theme);}catch(e){}l();};})();</script>
</body></html>
