<!doctype html>
<html data-theme="dark"><head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="bundle.css"><script src="bundle.js"></script><meta charset="utf-8"><title>Popup states</title></head>
<body>
<div class="proto-bar"><a href="index.html">Prototype</a><a href="panel.html">Panel button</a><a href="states.html" aria-current="page">Popup states</a><a href="indicators.html">Indicators</a><a href="picker.html">Indicator picker</a><a href="graph.html">Graph</a><a href="adapters.html">Adapter list</a><span class="sp"></span><button id="themeBtn" type="button">Theme: dark</button></div>
<div class="ca-stage" id="root"></div>
<script>
  var A = window.CosmicApplets, root = document.getElementById('root');
  var cases = [
    { tag: 'Idle (0 B/s)', icon: 'i-wired', name: 'enp5s0', meta: 'Ethernet · <span class="ca-ok">Connected</span>', d: Array(60).fill(0), u: Array(60).fill(0), rd: 0, ru: 0 },
    { tag: 'Disconnected (selected adapter down)', icon: 'i-wired', name: 'enp5s0', meta: '<span class="ca-err">Disconnected</span> · Ethernet', d: [0], u: [0], rd: null, ru: null, note: 'Cable unplugged' },
    { tag: 'Adapter missing (fallback active)', icon: 'i-net', name: 'enp5s0', meta: '<span class="ca-warn">enx00e04c680b2f not found</span> · using Automatic', sim: A.sim(8) }
  ];
  cases.forEach(function (c, i) {
    if (c.sim) { c.d = c.sim.down; c.u = c.sim.up; c.rd = c.d[59]; c.ru = c.u[59]; }
    var f = function (v) { var r = A.formatRate(v); return r.num.trim() + '<span class="u">' + r.unit + '</span>'; };
    var el = document.createElement('div'); el.className = 'col';
    el.innerHTML = '<span class="ca-tag">' + c.tag + '</span><div class="ca-popup">' +
      '<div class="ca-pad ca-head"><span class="ca-icon ' + c.icon + '"></span><div class="meta"><span class="ca-heading">' + c.name + '</span><span class="ca-caption">' + c.meta + '</span></div></div>' +
      '<div class="ca-pad ca-readouts"><div class="ca-readout"><div class="lbl ca-caption"><span class="ca-swatch-down"></span>Download</div><div class="val">' + f(c.rd) + '</div></div>' +
      '<div class="ca-readout"><div class="lbl ca-caption"><span class="ca-swatch-up"></span>Upload</div><div class="val">' + f(c.ru) + '</div></div></div>' +
      '<div class="ca-pad"><div class="ca-graph"><svg id="g' + i + '"></svg>' + (c.note ? '<span class="span">' + c.note + '</span>' : '<span class="span">60 s</span>') + '</div></div></div>';
    root.appendChild(el);
    A.drawGraph(document.getElementById('g' + i), c.d, c.u, { w: 304, h: 120, grid: 3, pad: 1 });
  });
</script>
<script>(function(){var r=document.documentElement,b=document.getElementById('themeBtn');try{var s=localStorage.getItem('ca-theme');if(s)r.dataset.theme=s;}catch(e){}
function l(){b.textContent='Theme: '+r.dataset.theme;}l();b.onclick=function(){r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('ca-theme',r.dataset.theme);}catch(e){}l();};})();</script>
</body></html>
