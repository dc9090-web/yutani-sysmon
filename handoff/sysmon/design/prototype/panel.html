<!doctype html>
<html data-theme="dark"><head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="bundle.css"><script src="bundle.js"></script><meta charset="utf-8"><title>SysPanelButton — preview</title><style>/* desktop backdrop so the panel strip (bg) reads as a separate surface */ body { background: var(--bg-component); }</style></head>
<body>
<div class="proto-bar"><a href="index.html">Prototype</a><a href="panel.html" aria-current="page">Panel button</a><a href="sections.html">Sections</a><a href="meters.html">Meters</a><a href="toggles.html">Toggles</a><a href="states.html">States</a><span class="sp"></span><button id="themeBtn" type="button">Theme: dark</button></div>
<div class="ca-stage" id="root"></div>
<script>
  var A = window.CosmicApplets, o = A.sysSim(9), NS = 'http://www.w3.org/2000/svg';
  var cases = [
    { tag: 'Numbers · all four', mode: 'numbers', ms: ['cpu', 'gpu', 'mem', 'disk'] },
    { tag: 'Graph · all four', mode: 'graph', ms: ['cpu', 'gpu', 'mem', 'disk'] },
    { tag: 'Both · CPU + RAM', mode: 'both', ms: ['cpu', 'mem'] },
    { tag: 'Numbers · CPU over 85 °C (warning)', mode: 'numbers', ms: ['cpu', 'gpu'], hot: true },
    { tag: 'Vertical · numbers / both', v: true, set: [{ mode: 'numbers', ms: ['cpu', 'gpu', 'mem', 'disk'] }, { mode: 'both', ms: ['cpu', 'mem'] }] }
  ];
  var root = document.getElementById('root');
  function chunk(m, mode, v, now) {
    var el = document.createElement('span');
    el.className = 'ca-metric' + (mode === 'both' && !v ? ' with-graph' : '') + (mode === 'graph' ? ' graph-only' : '');
    el.dataset.m = m; el.dataset.mode = mode;
    return el;
  }
  function render() {
    root.innerHTML = '';
    cases.forEach(function (c) {
      var col = document.createElement('div'); col.className = 'col';
      col.innerHTML = '<span class="ca-tag">' + c.tag + '</span>';
      var wrap = document.createElement('div'); wrap.style.cssText = 'display:flex;gap:16px;align-items:flex-start';
      (c.set || [c]).forEach(function (cc) {
        var panel = document.createElement('div'); panel.className = 'ca-panel ' + (c.v ? 'v' : 'h');
        var b = document.createElement('button'); b.className = 'ca-pbtn'; b.setAttribute('aria-label', 'System monitor');
        var sys = document.createElement('span'); sys.className = 'ca-sys';
        cc.ms.forEach(function (m) { var e = chunk(m, cc.mode, c.v); e.dataset.hot = c.hot ? 1 : ''; sys.appendChild(e); });
        b.appendChild(sys); panel.appendChild(b); wrap.appendChild(panel);
      });
      col.appendChild(wrap); root.appendChild(col);
    });
  }
  function paint() {
    [].forEach.call(document.querySelectorAll('.ca-metric'), function (e) {
      var m = e.dataset.m, mode = e.dataset.mode, v = e.closest('.ca-panel').classList.contains('v');
      var now = Object.assign({}, o.now); if (e.dataset.hot) now.cpuTemp = 91;
      var html = A.metricChunkHTML(m, now, { memTotal: o.memTotal });
      var lbl = html.slice(0, html.indexOf('</span>') + 7), val = html.slice(lbl.length);
      if (mode === 'numbers') e.innerHTML = html;
      else {
        e.innerHTML = (mode === 'graph' ? lbl : '') + '<svg aria-hidden="true"></svg>' + (mode === 'both' ? (v ? '' : lbl) + val : '');
        if (mode === 'both' && v) e.innerHTML = lbl + '<svg aria-hidden="true"></svg>' + val;
        var g = e.querySelector('svg');
        if (m === 'disk') A.drawGraph(g, o.dr, o.dw, { w: v ? 20 : 32, h: 20, pad: 1 });
        else A.drawSeries(g, m === 'mem' ? o.memPct : o[m], { w: v ? 20 : 32, h: 20, pad: 1, max: 100, cls: m });
      }
    });
  }
  render(); paint(); setInterval(function () { o.tick(); paint(); }, 1000);
</script>
<script>(function(){var r=document.documentElement,b=document.getElementById('themeBtn');try{var s=localStorage.getItem('ca-theme');if(s)r.dataset.theme=s;}catch(e){}
function l(){b.textContent='Theme: '+r.dataset.theme;}l();b.onclick=function(){r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('ca-theme',r.dataset.theme);}catch(e){}l();};})();</script>
</body></html>
