<!doctype html>
<html data-theme="dark"><head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="bundle.css"><script src="bundle.js"></script><meta charset="utf-8"><title>MetricSection — preview</title></head>
<body>
<div class="proto-bar"><a href="index.html">Prototype</a><a href="panel.html">Panel button</a><a href="sections.html" aria-current="page">Sections</a><a href="meters.html">Meters</a><a href="toggles.html">Toggles</a><a href="states.html">States</a><span class="sp"></span><button id="themeBtn" type="button">Theme: dark</button></div>
<div class="ca-stage"><div class="ca-popup" id="p"></div></div>
<script>
  var A = window.CosmicApplets, o = A.sysSim(4), p = document.getElementById('p');
  function paint() { p.innerHTML = '<section class="ca-msec">' + A.sysSectionHTML('cpu', o) + '</section><div class="ca-sep"></div><section class="ca-msec">' + A.sysSectionHTML('gpu', o) + '</section>'; A.paintSysGraphs(p, o); }
  paint(); setInterval(function () { o.tick(); paint(); }, 1000);
</script>
<script>(function(){var r=document.documentElement,b=document.getElementById('themeBtn');try{var s=localStorage.getItem('ca-theme');if(s)r.dataset.theme=s;}catch(e){}
function l(){b.textContent='Theme: '+r.dataset.theme;}l();b.onclick=function(){r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('ca-theme',r.dataset.theme);}catch(e){}l();};})();</script>
</body></html>
