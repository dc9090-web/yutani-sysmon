<!doctype html>
<html data-theme="dark"><head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="bundle.css"><script src="bundle.js"></script><meta charset="utf-8"><title>System Monitor states</title></head>
<body>
<div class="proto-bar"><a href="index.html">Prototype</a><a href="panel.html">Panel button</a><a href="sections.html">Sections</a><a href="meters.html">Meters</a><a href="toggles.html">Toggles</a><a href="states.html" aria-current="page">States</a><span class="sp"></span><button id="themeBtn" type="button">Theme: dark</button></div>
<div class="ca-stage" id="root"></div>
<script>
  var A = window.CosmicApplets, root = document.getElementById('root');
  function card(tag, html, o) { var c = document.createElement('div'); c.className = 'col'; c.innerHTML = '<span class="ca-tag">' + tag + '</span><div class="ca-popup">' + html + '</div>'; root.appendChild(c); A.paintSysGraphs(c, o); }
  var a = A.sysSim(2); card('No supported GPU (Intel/NVIDIA or none)', '<section class="ca-msec">' + A.sysSectionHTML('gpu', a, { gpuMissing: true }) + '</section>', a);
  var b = A.sysSim(6); b.now.cpu = 97; b.now.cpuTemp = 92; for (var i = 50; i < 60; i++) b.cpu[i] = 92 + (i % 3) * 3;
  card('CPU hot (Tctl ≥ 85 °C)', '<section class="ca-msec">' + A.sysSectionHTML('cpu', b) + '</section>', b);
  var c = A.sysSim(8); card('Sensors / RAPL unreadable', '<section class="ca-msec">' + A.sysSectionHTML('cpu', c, { sensorsMissing: true, cpuPowerMissing: true }) + '</section>', c);
</script>
<script>(function(){var r=document.documentElement,b=document.getElementById('themeBtn');try{var s=localStorage.getItem('ca-theme');if(s)r.dataset.theme=s;}catch(e){}
function l(){b.textContent='Theme: '+r.dataset.theme;}l();b.onclick=function(){r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('ca-theme',r.dataset.theme);}catch(e){}l();};})();</script>
</body></html>
