<!doctype html>
<html data-theme="dark"><head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="bundle.css"><script src="bundle.js"></script><meta charset="utf-8"><title>VPN icon — reticle states</title>
<style>
  .ic-grid { display: grid; grid-template-columns: 160px repeat(5, 72px); gap: 12px 16px; align-items: center; padding: 24px; }
  .ic-grid .h { font: 600 12px/17px var(--font-sans); color: var(--on-bg-muted); }
  .ic-grid .k { font: 400 13px/18px var(--font-sans); } .ic-grid .k span { display: block; color: var(--on-bg-muted); font-size: 12px; }
  .ic-grid .ca-icon { color: var(--on-bg); }
</style></head>
<body>
<div class="proto-bar"><a href="index.html">Prototype</a><a href="panel.html">Panel button</a><a href="tunnels.html">Tunnel cards</a><a href="settings.html">Settings</a><a href="states.html">States</a><a href="icon.html" aria-current="page">Icon</a><a href="icon-lab.html">Icon lab</a><span class="sp"></span><button id="themeBtn" type="button">Theme: dark</button></div>
<div class="ic-grid" id="g"></div>
<script>
  var rows = [['off', 'Off', 'Brackets open, both » thin lines'], ['p2p', 'Torrents only', 'First » solid'], ['web', 'Web only', 'Second » solid'], ['both', 'Both', 'Both » solid, brackets 1px in']];
  var h = '<div class="h">State · file</div>' + [16, 24, 32, 48, 64].map(function (s) { return '<div class="h">' + s + ' px</div>'; }).join('');
  rows.forEach(function (r) { h += '<div class="k">' + r[1] + '<span>vpn-reticle-' + r[0] + '-symbolic.svg</span><span>' + r[2] + '</span></div>' +
    [16, 24, 32, 48, 64].map(function (s) { return '<div><span class="ca-icon i-vpn-' + r[0] + '" style="width:' + s + 'px;height:' + s + 'px"></span></div>'; }).join(''); });
  document.getElementById('g').innerHTML = h;
</script>
<script>(function(){var r=document.documentElement,b=document.getElementById('themeBtn');try{var s=localStorage.getItem('ca-theme');if(s)r.dataset.theme=s;}catch(e){}
function l(){b.textContent='Theme: '+r.dataset.theme;}l();b.onclick=function(){r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('ca-theme',r.dataset.theme);}catch(e){}l();};})();</script>
</body></html>
