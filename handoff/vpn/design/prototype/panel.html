<!doctype html>
<html data-theme="dark"><head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="bundle.css"><script src="bundle.js"></script><meta charset="utf-8"><title>VpnPanelButton — preview</title><style>body { background: var(--bg-component); }</style></head>
<body>
<div class="proto-bar"><a href="index.html">Prototype</a><a href="panel.html" aria-current="page">Panel button</a><a href="tunnels.html">Tunnel cards</a><a href="settings.html">Settings</a><a href="states.html">States</a><a href="icon.html">Icon</a><a href="icon-lab.html">Icon lab</a><span class="sp"></span><button id="themeBtn" type="button">Theme: dark</button></div>
<div class="ca-stage" id="root"></div>
<script>
  var A = window.CosmicApplets, root = document.getElementById('root');
  function mk(f) { var v = A.vpnDefaults(); f(v); return v; }
  var cases = [
    ['Both off', mk(function () {})],
    ['Torrents connecting', mk(function (v) { v.p2p.state = 'connecting'; })],
    ['Torrents on · port forwarded (default)', mk(function (v) { v.p2p.state = 'on'; v.p2p.port.state = 'ok'; v.p2p.qbit = 'vpn'; })],
    ['Both on', mk(function (v) { v.p2p.state = 'on'; v.p2p.port.state = 'ok'; v.p2p.qbit = 'vpn'; v.web.state = 'on'; })],
    ['Web only', mk(function (v) { v.web.state = 'on'; })],
    ['Port hidden (setting off)', mk(function (v) { v.p2p.state = 'on'; v.p2p.port.state = 'ok'; v.showPort = false; v.web.state = 'on'; })],
    ['Handshake stale (warning dot)', mk(function (v) { v.p2p.state = 'stale'; v.p2p.port.state = 'ok'; })],
    ['qBittorrent outside VPN (error dot)', mk(function (v) { v.p2p.qbit = 'outside'; })],
    ['Tunnel error', mk(function (v) { v.web.state = 'error'; })]
  ];
  cases.forEach(function (c) { var el = document.createElement('div'); el.className = 'col';
    el.innerHTML = '<span class="ca-tag">' + c[0] + '</span><div class="ca-panel h"><button class="ca-pbtn">' + A.vpnPanelHTML(c[1]) + '</button></div>'; root.appendChild(el); });
  var v = document.createElement('div'); v.className = 'col'; v.innerHTML = '<span class="ca-tag">Vertical</span><div class="ca-panel v"><button class="ca-pbtn">' + A.vpnPanelHTML(cases[3][1]) + '</button></div>'; root.appendChild(v);
</script>
<script>(function(){var r=document.documentElement,b=document.getElementById('themeBtn');try{var s=localStorage.getItem('ca-theme');if(s)r.dataset.theme=s;}catch(e){}
function l(){b.textContent='Theme: '+r.dataset.theme;}l();b.onclick=function(){r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('ca-theme',r.dataset.theme);}catch(e){}l();};})();</script>
</body></html>
