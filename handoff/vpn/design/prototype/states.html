<!doctype html>
<html data-theme="dark"><head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="bundle.css"><script src="bundle.js"></script><meta charset="utf-8"><title>VPN states</title></head>
<body>
<div class="proto-bar"><a href="index.html">Prototype</a><a href="panel.html">Panel button</a><a href="tunnels.html">Tunnel cards</a><a href="settings.html">Settings</a><a href="states.html" aria-current="page">States</a><a href="icon.html">Icon</a><a href="icon-lab.html">Icon lab</a><span class="sp"></span><button id="themeBtn" type="button">Theme: dark</button></div>
<div class="ca-stage" id="root"></div>
<script>
  var A = window.CosmicApplets, root = document.getElementById('root');
  function mk(f) { var v = A.vpnDefaults(); f(v); return v; }
  function banner(t, body, btn) { return '<div class="ca-banner"><span class="ca-body">' + t + '</span><span class="ca-caption">' + body + '</span>' + (btn ? '<button class="ca-btn">' + btn + '</button>' : '') + '</div>'; }
  function full(v, extra) { return A.vpnHeadHTML(v) + A.leakHTML(v) + (extra || '') + '<div class="ca-sep full" style="margin:0 0 6px"></div>' + A.tunnelCardHTML('p2p', v) + '<div class="ca-sep"></div>' + A.tunnelCardHTML('web', v); }
  var off = A.vpnDefaults();
  var cases = [
    ['No configs imported (first run)', A.vpnHeadHTML(off) + banner('Import your Proton WireGuard configs', 'Download two configs from account.protonvpn.com → Downloads → WireGuard: one P2P server with NAT-PMP (port forwarding) on, one for web.', 'Import configs')],
    ['Helper not installed', A.vpnHeadHTML(off) + banner('System helper missing', 'The torrent tunnel and kill switch need the cosmic-vpn-helper service (root). Install the package, then reopen the applet.', '')],
    ['Leak · qBittorrent outside VPN', full(mk(function (v) { v.p2p.state = 'on'; v.p2p.port.state = 'ok'; v.p2p.qbit = 'outside'; }))],
    ['Server without port forwarding', full(mk(function (v) { v.p2p.state = 'on'; v.p2p.port.state = 'fail'; v.p2p.qbit = 'vpn'; v.web.state = 'on'; }))],
    ['Handshake stale (torrents pause, kill switch holds)', full(mk(function (v) { v.p2p.state = 'stale'; v.p2p.hs = 214; v.p2p.port.state = 'ok'; v.p2p.qbit = 'vpn'; }))],
    ['Web tunnel failed', full(mk(function (v) { v.web.state = 'error'; v.web.err = 'NetworkManager: activation failed (no secrets)'; }))]
  ];
  cases.forEach(function (c) { var el = document.createElement('div'); el.className = 'col'; el.innerHTML = '<span class="ca-tag">' + c[0] + '</span><div class="ca-popup">' + c[1] + '</div>'; root.appendChild(el); });
</script>
<script>(function(){var r=document.documentElement,b=document.getElementById('themeBtn');try{var s=localStorage.getItem('ca-theme');if(s)r.dataset.theme=s;}catch(e){}
function l(){b.textContent='Theme: '+r.dataset.theme;}l();b.onclick=function(){r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('ca-theme',r.dataset.theme);}catch(e){}l();};})();</script>
</body></html>
