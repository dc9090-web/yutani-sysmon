<!doctype html>
<html data-theme="dark"><head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="bundle.css"><script src="bundle.js"></script><meta charset="utf-8"><title>TunnelCard — preview</title></head>
<body>
<div class="proto-bar"><a href="index.html">Prototype</a><a href="panel.html">Panel button</a><a href="tunnels.html" aria-current="page">Tunnel cards</a><a href="settings.html">Settings</a><a href="states.html">States</a><a href="icon.html">Icon</a><a href="icon-lab.html">Icon lab</a><span class="sp"></span><button id="themeBtn" type="button">Theme: dark</button></div>
<div class="ca-stage" id="root"></div>
<script>
  var A = window.CosmicApplets, root = document.getElementById('root');
  function mk(f) { var v = A.vpnDefaults(); f(v); return v; }
  var cases = [
    ['Torrents · off', 'p2p', mk(function () {})],
    ['Torrents · connecting', 'p2p', mk(function (v) { v.p2p.state = 'connecting'; })],
    ['Torrents · port requested, qBittorrent starting', 'p2p', mk(function (v) { v.p2p.state = 'on'; v.p2p.port.state = 'req'; v.p2p.qbit = 'starting'; })],
    ['Torrents · connected (target state)', 'p2p', mk(function (v) { v.p2p.state = 'on'; v.p2p.port.state = 'ok'; v.p2p.qbit = 'vpn'; })],
    ['Torrents · qBittorrent not running', 'p2p', mk(function (v) { v.p2p.state = 'on'; v.p2p.port.state = 'ok'; })],
    ['Torrents · Web UI off (set port manually)', 'p2p', mk(function (v) { v.p2p.state = 'on'; v.p2p.port.state = 'ok'; v.p2p.port.applied = 'manual'; v.p2p.qbit = 'vpn'; })],
    ['Torrents · no port forwarding on this server', 'p2p', mk(function (v) { v.p2p.state = 'on'; v.p2p.port.state = 'fail'; v.p2p.qbit = 'vpn'; })],
    ['Torrents · handshake stale', 'p2p', mk(function (v) { v.p2p.state = 'stale'; v.p2p.hs = 214; v.p2p.port.state = 'ok'; v.p2p.qbit = 'vpn'; })],
    ['Web · off', 'web', mk(function () {})],
    ['Web · connected', 'web', mk(function (v) { v.web.state = 'on'; })],
    ['Web · connected, torrents also on', 'web', mk(function (v) { v.web.state = 'on'; v.p2p.state = 'on'; })],
    ['Web · error', 'web', mk(function (v) { v.web.state = 'error'; })]
  ];
  cases.forEach(function (c) { var el = document.createElement('div'); el.className = 'col';
    el.innerHTML = '<span class="ca-tag">' + c[0] + '</span><div class="ca-popup" style="padding:8px 0">' + A.tunnelCardHTML(c[1], c[2]) + '</div>'; root.appendChild(el); });
</script>
<script>(function(){var r=document.documentElement,b=document.getElementById('themeBtn');try{var s=localStorage.getItem('ca-theme');if(s)r.dataset.theme=s;}catch(e){}
function l(){b.textContent='Theme: '+r.dataset.theme;}l();b.onclick=function(){r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('ca-theme',r.dataset.theme);}catch(e){}l();};})();</script>
</body></html>
