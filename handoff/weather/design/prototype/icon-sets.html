<!doctype html>
<html data-theme="dark"><head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="bundle.css"><script src="bundle.js"></script><meta charset="utf-8"><title>Weather icon sets</title><style>html, body { background: var(--bg); }</style></head>
<body>
<div class="proto-bar"><a href="index.html">Prototype</a><a href="panel.html">Panel button</a><a href="current.html">Current</a><a href="hourly.html">Hourly</a><a href="daily.html">7-day</a><a href="details.html">Details</a><a href="locations.html">Locations</a><a href="icon-sets.html" aria-current="page">Icon sets</a><a href="states.html">States</a><span class="sp"></span><button id="themeBtn" type="button">Theme: dark</button></div>
<div class="ca-iconset" id="t"></div>
<script>
  var A = window.CosmicApplets;
  var rows = [
    ['Clear', 800, '01d'], ['Clear · night', 800, '01n'], ['Few / scattered clouds', 802, '02d'], ['Few clouds · night', 802, '02n'], ['Overcast', 804, '04d'],
    ['Windy (≥ 10.8 m/s, clear)', 800, '01d', 12], ['Windy (≥ 10.8 m/s, overcast)', 804, '04d', 12], ['Mist / fog / haze', 741, '50d'],
    ['Drizzle', 300, '09d'], ['Drizzle · night', 300, '09n'], ['Light rain', 500, '10d'], ['Light rain · night', 500, '10n'], ['Heavy rain', 502, '10d'],
    ['Showers', 521, '09d'], ['Showers · night', 521, '09n'], ['Thunderstorm', 211, '11d'], ['Thunderstorm · night', 211, '11n'], ['Thunderstorm with rain', 201, '11d'],
    ['Snow', 601, '13d'], ['Snow showers', 621, '13d'], ['Snow showers · night', 621, '13n'], ['Sleet / freezing rain', 611, '13d']
  ];
  function three(set, r) { A.setWxIconSet(set); var h = A.wxIcon(r[2], null, r[1], r[3]); return '<div class="c">' + h + h + h + '</div>'; }
  var out = '<span class="h">Condition (id · icon)</span><span class="h">Detailed (Pixeden) · 40 · 20 · 16</span><span class="h">System (COSMIC) · 40 · 20 · 16</span><div class="rule"></div>';
  rows.forEach(function (r) { out += '<span class="k">' + r[0] + ' <span>' + r[1] + ' · ' + r[2] + '</span></span>' + three('detailed', r) + three('system', r); });
  out += '<div class="rule"></div><span class="k">Extras (Detailed only)</span><div class="c"><span class="ca-icon pd-temp-high"></span><span class="ca-icon pd-temp-mid" style="width:20px;height:20px"></span><span class="ca-icon pd-temp-low" style="width:16px;height:16px"></span></div><div class="c" style="gap:16px"><span class="ca-icon pd-humidity" style="width:20px;height:20px"></span><span class="ca-icon pd-compass" style="width:20px;height:20px"></span><span class="ca-icon pd-compass-alt" style="width:20px;height:20px"></span><span class="ca-tag">humidity · wind (rotates)</span></div>';
  document.getElementById('t').innerHTML = out; A.setWxIconSet('detailed');
</script>
<script>(function(){var r=document.documentElement,b=document.getElementById('themeBtn');try{var s=localStorage.getItem('ca-theme');if(s)r.dataset.theme=s;}catch(e){}
function l(){b.textContent='Theme: '+r.dataset.theme;}l();b.onclick=function(){r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('ca-theme',r.dataset.theme);}catch(e){}l();};})();</script>
</body></html>
