<!doctype html>
<html data-theme="dark"><head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="bundle.css"><script src="bundle.js"></script><meta charset="utf-8"><title>WxPanelButton — preview</title><style>body { background: var(--bg-component); }</style></head>
<body>
<div class="proto-bar"><a href="index.html">Prototype</a><a href="panel.html" aria-current="page">Panel button</a><a href="current.html">Current</a><a href="hourly.html">Hourly</a><a href="daily.html">7-day</a><a href="details.html">Details</a><a href="locations.html">Locations</a><a href="icon-sets.html">Icon sets</a><a href="states.html">States</a><span class="sp"></span><button id="themeBtn" type="button">Theme: dark</button></div>
<div class="ca-stage" id="root"></div>
<script>
  var A = window.CosmicApplets, L = A.WX_LOCATIONS, syd = A.wxSim(L[0], 'metric'), bne = A.wxSim(L[1], 'metric'), tyo = A.wxSim(L[2], 'imperial');
  var cases = [['Icon + temperature (default)', syd, {}], ['+ city name', syd, { city: true }], ['+ high / low', syd, { hilo: true }], ['City + high / low', tyo, { city: true, hilo: true }],
    ['Active weather alert (dot)', bne, {}], ['Panel L', syd, { sz: 'l' }]];
  var root = document.getElementById('root');
  cases.forEach(function (c) { var el = document.createElement('div'); el.className = 'col';
    el.innerHTML = '<span class="ca-tag">' + c[0] + '</span><div class="ca-panel h' + (c[2].sz ? ' sz-' + c[2].sz : '') + '"><button class="ca-pbtn" title="' + c[1].loc.name + ': ' + A.fmtT(c[1].current.temp) + ', ' + c[1].current.desc + '">' + A.wxPanelHTML(c[1], c[2]) + '</button></div>'; root.appendChild(el); });
  var v = document.createElement('div'); v.className = 'col'; v.innerHTML = '<span class="ca-tag">Vertical</span><div class="ca-panel v"><button class="ca-pbtn">' + A.wxPanelHTML(syd, {}) + '</button></div>'; root.appendChild(v);
</script>
<script>(function(){var r=document.documentElement,b=document.getElementById('themeBtn');try{var s=localStorage.getItem('ca-theme');if(s)r.dataset.theme=s;}catch(e){}
function l(){b.textContent='Theme: '+r.dataset.theme;}l();b.onclick=function(){r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('ca-theme',r.dataset.theme);}catch(e){}l();};})();</script>
</body></html>
