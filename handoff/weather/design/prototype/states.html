<!doctype html>
<html data-theme="dark"><head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="bundle.css"><script src="bundle.js"></script><meta charset="utf-8"><title>Weather states</title></head>
<body>
<div class="proto-bar"><a href="index.html">Prototype</a><a href="panel.html">Panel button</a><a href="current.html">Current</a><a href="hourly.html">Hourly</a><a href="daily.html">7-day</a><a href="details.html">Details</a><a href="locations.html">Locations</a><a href="icon-sets.html">Icon sets</a><a href="states.html" aria-current="page">States</a><span class="sp"></span><button id="themeBtn" type="button">Theme: dark</button></div>
<div class="ca-stage" id="root"></div>
<script>
  var A = window.CosmicApplets, root = document.getElementById('root'), syd = A.wxSim(A.WX_LOCATIONS[0], 'metric');
  function head(name, region, upd, cls) { return '<div class="ca-wxhead"><button class="loc"><span class="ca-heading"><span>' + name + '</span>' + (region ? '<span class="ca-icon i-down"></span>' : '') + '</span><span class="ca-caption">' + (region || '') + '</span></button><span class="upd' + (cls ? ' ' + cls : '') + '">' + upd + '</span>' + (upd ? '<button class="ca-iconbtn" aria-label="Refresh now"><span class="ca-icon i-refresh"></span></button>' : '') + '</div>'; }
  function banner(t, body, btn) { return '<div class="ca-banner"><span class="ca-body">' + t + '</span><span class="ca-caption">' + body + '</span>' + (btn ? '<button class="ca-btn">' + btn + '</button>' : '') + '</div>'; }
  var stale = function (w) { return '<div style="opacity:.55">' + A.wxCurrentHTML(w) + '</div>'; };
  var cases = [
    ['No API key (first run)', head('Weather', '', ''), banner('Add an OpenWeather API key', 'Create a free key at openweathermap.org → API keys, then paste it in Applet settings. New keys can take up to 2 hours to activate.', 'Open settings')],
    ['Invalid or inactive key', head('Sydney', 'New South Wales, AU', ''), banner('API key not accepted', 'OpenWeather returned 401. Check the key, or wait for a new key to activate.', 'Open settings')],
    ['Free plan (no One Call subscription)', head('Sydney', 'New South Wales, AU', 'Updated 4m ago'), A.wxCurrentHTML(syd) + '<div class="ca-sep"></div><div class="ca-wxsec ca-caption-heading">Next 24 hours · 3-hour steps</div><div class="ca-wxhourly">' + A.wxHourlySVG(syd) + '</div><div class="ca-sep"></div><div class="ca-wxsec ca-caption-heading">5-day forecast</div>' + A.wxDailyHTML(Object.assign({}, syd, { daily: syd.daily.slice(0, 5) })) + '<div class="ca-sep"></div>' + A.wxDetailsHTML(syd, { noUv: true }) + '<div class="ca-attrib">Free plan: 5 days, 3-hour steps, no UV or alerts. Subscribe to One Call for the full forecast.</div>'],
    ['Offline (showing last data)', head('Sydney', 'New South Wales, AU', 'Offline · 52m ago', 'ca-warn'), stale(syd)],
    ['No locations', head('Weather', '', ''), banner('Choose a location', 'Search for a city to start.', 'Add location')]
  ];
  cases.forEach(function (c) { var el = document.createElement('div'); el.className = 'col'; el.innerHTML = '<span class="ca-tag">' + c[0] + '</span><div class="ca-popup">' + c[1] + c[2] + '</div>'; root.appendChild(el); });
</script>
<script>(function(){var r=document.documentElement,b=document.getElementById('themeBtn');try{var s=localStorage.getItem('ca-theme');if(s)r.dataset.theme=s;}catch(e){}
function l(){b.textContent='Theme: '+r.dataset.theme;}l();b.onclick=function(){r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('ca-theme',r.dataset.theme);}catch(e){}l();};})();</script>
</body></html>
