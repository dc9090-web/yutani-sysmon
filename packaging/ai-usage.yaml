# nfpm config: packaging/build.sh turns this into .deb, .rpm and Arch packages.
name: yutani-ai-usage
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: dc9090-web <noreply@github.com>
homepage: https://github.com/dc9090-web/yutani-sysmon
license: GPL-3.0-or-later
description: |
  Yutani AI Usage: COSMIC panel applet with Claude session, weekly and Fable usage limits and reset times.
depends:
  - libxkbcommon
archlinux:
  packager: dc9090-web <noreply@github.com>
overrides:
  deb:
    depends:
      - libxkbcommon0
contents:
  - src: target/release/cosmic-applet-ai-usage
    dst: /usr/bin/cosmic-applet-ai-usage
    file_info: { mode: 0755 }
  - src: crates/ai-usage/resources/io.github.dc.CosmicAppletAiUsage.desktop
    dst: /usr/share/applications/io.github.dc.CosmicAppletAiUsage.desktop
  - src: crates/ai-usage/resources/icons/hicolor/scalable/apps/io.github.dc.CosmicAppletAiUsage-symbolic.svg
    dst: /usr/share/icons/hicolor/scalable/apps/io.github.dc.CosmicAppletAiUsage-symbolic.svg
