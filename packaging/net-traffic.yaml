# nfpm config: packaging/build.sh turns this into .deb, .rpm and Arch packages.
name: yutani-net-traffic
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: dc9090-web <noreply@github.com>
homepage: https://github.com/dc9090-web/yutani-sysmon
license: GPL-3.0-or-later
description: |
  Yutani Network Traffic: COSMIC panel applet with live download and upload rates for one network adapter.
depends:
  - libxkbcommon
archlinux:
  packager: dc9090-web <noreply@github.com>
overrides:
  deb:
    depends:
      - libxkbcommon0
contents:
  - src: target/release/cosmic-applet-net-traffic
    dst: /usr/bin/cosmic-applet-net-traffic
    file_info: { mode: 0755 }
  - src: crates/net-traffic/resources/io.github.dc.CosmicAppletNetTraffic.desktop
    dst: /usr/share/applications/io.github.dc.CosmicAppletNetTraffic.desktop
  - src: crates/net-traffic/resources/icons/hicolor/scalable/apps/io.github.dc.CosmicAppletNetTraffic-symbolic.svg
    dst: /usr/share/icons/hicolor/scalable/apps/io.github.dc.CosmicAppletNetTraffic-symbolic.svg
  - src: crates/net-traffic/resources/icons/hicolor/scalable/actions/net-down-bar-symbolic.svg
    dst: /usr/share/icons/hicolor/scalable/actions/net-down-bar-symbolic.svg
  - src: crates/net-traffic/resources/icons/hicolor/scalable/actions/net-up-bar-symbolic.svg
    dst: /usr/share/icons/hicolor/scalable/actions/net-up-bar-symbolic.svg
