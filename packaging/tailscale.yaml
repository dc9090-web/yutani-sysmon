# nfpm config: packaging/build.sh turns this into .deb, .rpm and Arch packages.
name: yutani-tailscale
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: dc9090-web <noreply@github.com>
homepage: https://github.com/dc9090-web/yutani-sysmon
license: GPL-3.0-or-later
description: |
  Yutani Tailscale: COSMIC panel applet with Tailscale status, an on/off switch, an exit-node picker and a device list.
depends:
  - libxkbcommon
suggests:
  - tailscale
archlinux:
  packager: dc9090-web <noreply@github.com>
overrides:
  deb:
    depends:
      - libxkbcommon0
contents:
  - src: target/release/cosmic-applet-tailscale
    dst: /usr/bin/cosmic-applet-tailscale
    file_info: { mode: 0755 }
  - src: crates/tailscale/resources/io.github.dc.CosmicAppletTailscale.desktop
    dst: /usr/share/applications/io.github.dc.CosmicAppletTailscale.desktop
  - src: crates/tailscale/resources/icons/io.github.dc.CosmicAppletTailscale-symbolic.svg
    dst: /usr/share/icons/hicolor/scalable/apps/io.github.dc.CosmicAppletTailscale-symbolic.svg
